services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mernchat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-setup:
    image: node:20
    working_dir: /app/next-js-frontend
    volumes:
      - ./:/app
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mernchat
      DIRECT_URL: postgresql://postgres:postgres@db:5432/mernchat
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: node:20
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: sh -c "npm install && npx prisma generate && npm run dev"
    ports:
      - "8000:8000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: DEVELOPMENT
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mernchat
      DIRECT_URL: postgresql://postgres:postgres@db:5432/mernchat
      CLIENT_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  frontend:
    image: node:20
    working_dir: /app/next-js-frontend
    volumes:
      - ./:/app
    command: sh -c "npm install && npx prisma generate && npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mernchat
      DIRECT_URL: postgresql://postgres:postgres@db:5432/mernchat
      NEXT_PUBLIC_BASE_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}/api/v1
      NEXT_PUBLIC_ABSOLUTE_BASE_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      NEXT_PUBLIC_CLIENT_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
